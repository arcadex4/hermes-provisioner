name: Provision Hermes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Try to provision instance
        run: |
          set +e
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub
          for AD in "AQIi:US-ASHBURN-AD-1" "AQIi:US-ASHBURN-AD-2" "AQIi:US-ASHBURN-AD-3"; do
            echo "Trying $AD..."
            result=$(oci compute instance launch \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
              --image-id "${{ secrets.OCI_IMAGE_ID }}" \
              --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
              --assign-public-ip true \
              --display-name "hermes" \
              --ssh-authorized-keys-file /tmp/ssh_key.pub \
              --connection-timeout 10 \
              --read-timeout 30 2>&1)
            if echo "$result" | grep -q '"id"'; then
              echo "SUCCESS!"
              echo "$result"
              exit 0
            else
              echo "Failed: $result"
            fi
          done
          exit 1
