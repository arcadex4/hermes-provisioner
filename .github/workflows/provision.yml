name: Provision Hermes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Try to provision instance
        run: |
          set +e
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub
          for AD in "AQIi:US-ASHBURN-AD-1" "AQIi:US-ASHBURN-AD-2" "AQIi:US-ASHBURN-AD-3"; do
            echo "Trying $AD..."
            result=$(oci compute instance launch \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
              --image-id "ocid1.image.oc1.iad.aaaaaaaa43mhod2mxpjivckby6qsa2cmy6x3hj6bgb2xplozrib3edslmnpq" \
              --subnet-id "ocid1.subnet.oc1.iad.aaaaaaaacbrs3qjvzlnfih65wsdww6agxlfvcehre2swh3tiqmen5tdcy22a" \
              --assign-public-ip true \
              --display-name "hermes" \
              --ssh-authorized-keys-file /tmp/ssh_key.pub 2>&1)
            if echo "$result" | grep -q '"id"'; then
              echo "SUCCESS!"
              echo "$result"
              exit 0
            else
              echo "Failed: $result"
            fi
          done
          exit 1
